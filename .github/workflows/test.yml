name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Модульные тесты
        run: npm test
      - name: Проверка в Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run smoke
